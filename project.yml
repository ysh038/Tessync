# XcodeGen spec. 맥에서 `xcodegen generate`로 Tessync.xcodeproj를 만든다.
# BUNDLE_ID_PREFIX와 DEVELOPMENT_TEAM을 본인 값으로 바꿔야 한다.
#
# 무료 계정(Personal Team)은 App Group을 쓸 수 없어서 기본값은 App Group 없이 빌드한다.
# 이때 진단 로그는 방송 중 http://<주소>:8080/log 로 본다.
# 유료 계정이면 두 타깃에 아래 entitlements를 추가하면 앱 안에서 로그를 볼 수 있다.
#   entitlements:
#     path: App/Tessync.entitlements   (익스텐션은 Broadcast/TessyncBroadcast.entitlements)
#     properties:
#       com.apple.security.application-groups:
#         - group.$(BUNDLE_ID_PREFIX).tessync
name: Tessync
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: com.ysh038
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Tessync:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: TessyncBroadcast
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tessync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 테슬라 브라우저가 핫스팟을 통해 이 iPhone에 접속하려면 로컬 네트워크 권한이 필요합니다.
        TessyncAppGroup: group.$(BUNDLE_ID_PREFIX).tessync
        # 앱이 127.0.0.1의 방송 서버(/status, /log)에 http로 묻기 위해 필요하다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tessync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TessyncBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Tessync
        NSLocalNetworkUsageDescription: 테슬라 브라우저가 핫스팟을 통해 이 iPhone에 접속하려면 로컬 네트워크 권한이 필요합니다.
        TessyncAppGroup: group.$(BUNDLE_ID_PREFIX).tessync
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tessync.broadcast
schemes:
  Tessync:
    build:
      targets:
        Tessync: all
        TessyncBroadcast: all
    run:
      config: Debug
