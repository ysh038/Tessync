<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tessync</title>
<style>
  :root {
    --bg: #0F1416; --card: #1A2125; --text: #EEEFEA; --sub: #9AA6AC; --sage: #829C9E;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(15, 20, 22, 0.82); transition: opacity 0.25s; pointer-events: none;
  }
  #overlay.hidden { opacity: 0; }
  .panel {
    max-width: 640px; padding: 40px 48px; border-radius: 28px; background: var(--card); text-align: center;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
  }
  .brand { margin-bottom: 20px; color: var(--sage); font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  .spinner {
    width: 44px; height: 44px; margin: 0 auto 24px; border-radius: 50%;
    border: 4px solid rgba(130, 156, 158, 0.25); border-top-color: var(--sage); animation: spin 0.9s linear infinite;
  }
  .panel.still .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { color: var(--text); font-size: 32px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  #hint { margin-top: 12px; color: var(--sub); font-size: 19px; line-height: 1.55; word-break: keep-all; }
  #hint:empty { display: none; }
  #debug {
    position: fixed; right: 12px; bottom: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(26, 33, 37, 0.88);
    color: #9FE3B4; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; display: none;
  }
  #debug.on { display: block; }
  #debugToggle { position: fixed; right: 0; top: 0; width: 72px; height: 72px; }
  .ripple {
    position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none;
    border: 3px solid rgba(255, 255, 255, 0.9); animation: ripple 0.5s ease-out forwards;
  }
  @keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  #fullscreen {
    position: fixed; left: 16px; top: 16px; padding: 12px 20px; border: 0; border-radius: 999px;
    background: rgba(26, 33, 37, 0.85); color: var(--text); font: 600 16px var(--font);
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="overlay"><div class="panel" id="panel"><div class="brand">Tessync</div><div class="spinner"></div><div id="status">연결 중…</div><div id="hint"></div></div></div>
<button id="fullscreen" hidden>전체화면</button>
<div id="debugToggle"></div>
<div id="debug"></div>
<script src="player.js"></script>
</body>
</html>
